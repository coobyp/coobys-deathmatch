name: CI/CD

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  linux:
    name: Linux i386 (Steam Runtime scout)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Build
        run: docker run --rm -v ${{ github.workspace }}:/src -w /src registry.gitlab.steamos.cloud/steamrt/scout/sdk/i386:latest sh -c 'cd /src/linux && make CFG=release COMPILER=g++-9 -j2'

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: linux-bin
          path: |
            linux/release/client.so
            linux/release/hl.so

  win32:
    name: Win32
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@30375c66a4eea26614e0d39710365f22f8b0af57 # v3
        with:
          msbuild-architecture: x86

      - name: Build
        run: MSBuild -maxCpuCount:2 -property:Configuration=Release -target:Rebuild projects/vs2019/projects.sln

      - name: Upload
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: win32-bin
          path: |
            projects/vs2019/Release/hl_cdll/client.dll
            projects/vs2019/Release/hldll/hl.dll

  package:
    name: Package coobydm
    needs: [linux, win32]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download binaries
        uses: actions/download-artifact@v4
        with:
          path: bin

      - name: Assemble mod folder
        run: |
          set -e
          out=dist/coobys-deathmatch
          mkdir -p $out/coobydm/dlls $out/coobydm/cl_dlls
          cp -r mod/coobydm/. $out/coobydm/
          find bin -name hl.dll -exec cp {} $out/coobydm/dlls/ \;
          find bin -name hl.so -exec cp {} $out/coobydm/dlls/ \;
          find bin -name client.dll -exec cp {} $out/coobydm/cl_dlls/ \;
          find bin -name client.so -exec cp {} $out/coobydm/cl_dlls/ \;
          cp installer/install.bat installer/install.ps1 installer/install.sh $out/
          cp -r server $out/server
          cp README.md $out/
          ls -R $out

      - name: Upload package
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coobys-deathmatch
          path: dist/

  setup_exe:
    name: Build Setup.exe
    needs: [package]
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download package
        uses: actions/download-artifact@v4
        with:
          name: coobys-deathmatch
          path: dist

      - name: Build installer
        shell: pwsh
        run: |
          $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          if (-not $iscc) {
            choco install innosetup -y --no-progress
            $iscc = Get-ChildItem "${env:ProgramFiles(x86)}\Inno Setup*\ISCC.exe", "$env:ProgramFiles\Inno Setup*\ISCC.exe" -ErrorAction SilentlyContinue | Select-Object -First 1
          }
          Invoke-WebRequest https://aka.ms/vs/17/release/vc_redist.x86.exe -OutFile installer\vc_redist.x86.exe
          & $iscc.FullName "/DSourceDir=$PWD\dist\coobys-deathmatch\coobydm" installer\coobydm.iss
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-ChildItem installer\Output

      - name: Upload Setup.exe
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: CoobysDeathmatch-Setup
          path: installer/Output/CoobysDeathmatch-Setup.exe

  release:
    name: Release on tag
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [package, setup_exe]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Publish release
        run: |
          cd artifacts/coobys-deathmatch && zip -r ../../coobys-deathmatch-${GITHUB_REF_NAME}.zip coobys-deathmatch && cd ../..
          gh release create "$GITHUB_REF_NAME" -R "$GITHUB_REPOSITORY" --generate-notes \
            coobys-deathmatch-${GITHUB_REF_NAME}.zip artifacts/CoobysDeathmatch-Setup/CoobysDeathmatch-Setup.exe
        env:
          GH_TOKEN: ${{ github.token }}

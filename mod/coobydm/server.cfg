// Cooby's Deathmatch server config
hostname "Cooby's Deathmatch"
sv_lan 0
sv_region 255
sv_contact "discord"

// match rules
mp_timelimit 15
mp_fraglimit 30
mp_teamplay 0
mp_weaponstay 1
mp_falldamage 0
mp_forcerespawn 1
mp_footsteps 1
mp_flashlight 1
mp_friendlyfire 0
mp_autocrosshair 0
mp_allowmonsters 0

// keep the classic HL movement feel
sv_gravity 800
sv_maxspeed 320
sv_airaccelerate 10
sv_accelerate 10
sv_friction 4
sv_stopspeed 100

// rcon_password "change-me"   // set this on the real server, not in git
// sv_password ""              // uncomment to make it Discord-members-only

// netcode
sv_maxrate 100000
sv_minrate 20000
sv_maxupdaterate 101
sv_minupdaterate 30

mapcyclefile mapcycle.txt
log on
